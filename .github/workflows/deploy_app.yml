name: Deploy Chatbot API

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The UI uses a pre-built Tailwind stylesheet instead of the Tailwind CDN,
      # so the Content-Security-Policy can block all third-party scripts.
      - name: Build Tailwind CSS
        run: |
          cd src/app
          npx --yes tailwindcss@3.4.17 -c tailwind/tailwind.config.js -i tailwind/input.css -o static/vendor/tailwind.css --minify

      - name: Zip Application Code
        run: |
          cd src/app
          zip -r ../../app.zip . -x "tailwind/*" "__pycache__/*"
          
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_SERVICE_NAME }}
          package: app.zip
          startup-command: 'gunicorn --bind=0.0.0.0:$PORT --timeout 600 -k uvicorn.workers.UvicornWorker main:app'
