<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure MS Cloud Chatbot</title>
    <!-- All assets are served from this app (no CDNs) so a strict Content-Security-Policy can apply -->
    <link rel="stylesheet" href="/static/vendor/tailwind.css">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/app.css">
    <!-- Markdown rendering for bot answers (sanitized with DOMPurify before display) -->
    <script src="/static/vendor/marked.min.js" defer></script>
    <script src="/static/vendor/purify.min.js" defer></script>
    <script src="/static/app.js" defer></script>
</head>
<body class="bg-[#f8fafc] h-screen flex flex-col font-sans text-slate-800">

    <!-- Top Navigation Bar -->
    <header class="h-14 bg-white border-b border-slate-200 px-6 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center space-x-3">
            <img src="/static/logo.png" alt="Company Logo" class="h-6 object-contain">
            <h1 class="text-base font-semibold text-slate-800">Azure MS Cloud Chatbot</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button id="toggleHistoryBtn" class="text-xs border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded text-slate-600 flex items-center space-x-1.5">
                <i class="fa-regular fa-window-restore"></i>
                <span id="toggleText">Hide chat history</span>
            </button>
            <button class="text-xs bg-[#0078d4] hover:bg-[#106ebe] text-white px-3 py-1.5 rounded flex items-center space-x-1.5">
                <i class="fa-solid fa-share-nodes"></i>
                <span>Share</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Center Chat Container -->
        <main class="flex-1 flex flex-col justify-between items-center relative overflow-hidden">

            <!-- Messages Stream -->
            <div id="chatStream" class="w-full max-w-4xl flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">

                <!-- Initial Hero Welcome -->
                <div id="heroSection" class="flex flex-col items-center justify-center h-full text-center my-auto pt-16">
                    <img src="/static/logo.png" alt="Company Logo" class="h-12 object-contain mb-4">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Azure MS Cloud Chatbot. Start chatting.</h2>
                    <p class="text-sm text-slate-500 max-w-lg leading-relaxed">
                        Welcome to the Azure MS Cloud Chatbot! Please use it to help resolve customer support issues, find important wiki articles, and improve your workflow.
                    </p>
                </div>

            </div>

            <!-- Input Box Section -->
            <div class="w-full max-w-3xl px-6 pb-6 pt-2">
                <div id="composer" class="bg-white border border-slate-300 rounded-xl shadow-sm focus-within:ring-2 focus-within:ring-[#0078d4] focus-within:border-transparent p-3 flex flex-col">
                    <!-- Attached screenshots / log files waiting to be sent -->
                    <div id="attachTray" class="hidden flex flex-wrap gap-2 pb-2"></div>
                    <div id="attachError" class="hidden text-xs text-red-600 pb-2"></div>
                    <textarea id="userInput" rows="2" placeholder="Type a question, or paste a screenshot of the error..." class="w-full resize-none outline-none text-sm text-slate-700 placeholder-slate-400"></textarea>
                    <div class="flex justify-between items-center pt-2">
                        <div class="flex space-x-2 text-slate-400 text-xs">
                            <input id="fileInput" type="file" class="hidden" multiple
                                   accept="image/png,image/jpeg,image/webp,image/gif,.txt,.log,.json,.csv,.md,.xml,.yaml,.yml,.ini,.cfg,.out,.err,text/plain">
                            <button id="attachBtn" type="button" class="hover:text-slate-600 cursor-pointer p-1 disabled:opacity-40" title="Attach a screenshot or log file (or paste / drag it in)" aria-label="Attach a screenshot or log file"><i class="fa-solid fa-paperclip"></i></button>
                            <span id="newChatInlineBtn" role="button" tabindex="0" class="hover:text-slate-600 cursor-pointer p-1" title="New chat"><i class="fa-regular fa-pen-to-square"></i></span>
                        </div>
                        <button id="sendBtn" type="button" class="text-[#0078d4] hover:text-[#106ebe] disabled:opacity-40 p-1">
                            <i class="fa-solid fa-paper-plane text-base"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Chat History Sidebar -->
        <aside id="sidebar" class="w-72 bg-white border-l border-slate-200 flex flex-col flex-shrink-0 transition-all duration-300">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <span class="text-sm font-semibold text-slate-800">Chat history</span>
                <button id="newChatSidebarBtn" type="button" title="New Chat" class="text-xs text-slate-500 hover:text-slate-800 p-1">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <div id="historyList" class="flex-1 overflow-y-auto p-3 space-y-1 text-xs custom-scrollbar">
                <div class="text-slate-400 px-2 py-1">Loading history...</div>
            </div>
        </aside>

    </div>

</body>
</html>
